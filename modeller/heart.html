<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBFBF9; --card: #FFFFFF; --ink: #1C1F23; --muted: #5C6166; --faint: #8A8F94; --fainter: #B4B2A9;
  --line: #DEDDD7; --rule: #ECEBE6; --seg: #C9C8C1;
  --go: #0F6E56; --go-bg: #E1F5EE; --go-ink: #04342C;
  --red: #A32D2D; --red-bg: #FCEBEB; --red-line: #F09595; --red-ink: #791F1F;
  --amber: #EF9F27; --amber-bg: #FAEEDA; --amber-ink: #854F0B; --amber-deep: #633806; --amber-me: #BA7517;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
.mono { font-family: var(--mono); }

.page { padding: 32px 40px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 24px; font-weight: 500; }
header p { margin: 0; font-size: 15px; color: var(--muted); }
header .alone { color: var(--amber-ink); }
[hidden] { display: none !important; }
.cols { display: grid; grid-template-columns: 330px 360px minmax(0, 1fr); gap: 28px; align-items: start; }
.head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.head h2 { margin: 0; font-size: 13px; font-weight: 400; color: var(--faint); }
.icon { width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--muted); }
.eye[aria-pressed="true"] { color: var(--go); }
.info { color: var(--amber-ink); }
.info.red { color: var(--red); }

/* Stories */
.stories { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.stories li { display: flex; align-items: center; }
.story { flex: 1; text-align: left; font-size: 14px; line-height: 1.35; padding: 6px 9px; border-radius: 8px; border: 2px solid transparent; background: transparent; color: var(--faint); }
.story.on { background: var(--go-bg); color: var(--go-ink); }
.story.unasked { border: 2px dashed var(--amber); color: var(--amber-deep); }
.story.me { border: 2px solid var(--ink); }
.story .cannot { color: var(--red); }
.story .tag { color: var(--amber-ink); font-weight: 500; }

/* Documents */
.docs { display: flex; flex-direction: column; gap: 10px; }
.doc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.doc.on { background: var(--go-bg); border: 2px solid var(--go); }
.doc.unasked:not(.on) { border: 2px dashed var(--amber); }
.doc.me { background: var(--card); border: 2px solid var(--ink); }
.doc.me.warn { border-color: var(--amber-me); }
.doc-top { display: flex; align-items: center; }
.doc-pick { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 12px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--ink); }
.doc.dim .doc-pick { color: var(--faint); }
.doc.unasked .doc-pick { color: var(--amber-deep); }
.doc-name { font-size: 16px; font-weight: 500; }
.doc-for { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-unasked { display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 14px; margin-top: -8px; font-size: 13px; color: var(--amber-ink); }
.doc-more { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 4px; }
.shape { font-family: var(--mono); font-size: 12px; line-height: 1.7; }
.cost { font-size: 13px; color: var(--muted); }
.cost.warn { color: var(--amber-ink); }

/* Entities */
.erd-wrap { overflow-x: auto; padding-bottom: 4px; }
.erd { position: relative; }
.seg { position: absolute; background: var(--seg); }
.node { position: absolute; width: 176px; height: 46px; }
.ent { width: 100%; height: 100%; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 5px 10px; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.ent .name { font-size: 14px; font-weight: 500; color: var(--faint); }
.ent .sub { display: block; max-width: 100%; font-family: var(--mono); font-size: 11px; color: var(--fainter); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ent.red { background: var(--red-bg); border: 1px solid var(--red-line); padding-right: 46px; }
.ent.red .name { color: var(--red-ink); }
.ent.red .sub { color: var(--red); }
.ent.on { background: var(--go-bg); border: 2px solid var(--go); }
.ent.on .name { color: var(--go-ink); }
.ent.on .sub { color: var(--go); }
.ent.me { border: 2px solid var(--ink); }
.node .info { position: absolute; right: 1px; top: 1px; }
.empty { font-size: 14px; color: var(--faint); padding: 8px 0; }
.legend { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* The popover, and the view it grows into */
.pop { position: absolute; width: 340px; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(28, 31, 35, 0.10); display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.4; }
.pop h3 { margin: 0; font-size: 14px; font-weight: 500; color: var(--amber-deep); }
.pop.red h3 { color: var(--red-ink); }
.pop p { margin: 0; }
.pop .second { color: var(--muted); }
.pop .acts { display: flex; justify-content: flex-end; gap: 2px; }
.pop .icon { color: var(--ink); }
.grown { position: fixed; inset: 0; z-index: 3; overflow: auto; background: var(--paper); padding: 32px 40px; display: flex; flex-direction: column; gap: 26px; }
.grown-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.grown-head .icon { border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.status { font-size: 15px; color: var(--amber-ink); }
.status.red { color: var(--red); }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
.three > div { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.three h2 { margin: 0; font-size: 13px; font-weight: 400; color: var(--faint); }
.three p { margin: 0; font-size: 15px; line-height: 1.45; }
.three p.second { color: var(--muted); }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.8; overflow-x: auto; }
.box .faint, .where { color: var(--faint); }
.where { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.scale { display: flex; justify-content: space-between; font-size: 15px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.scale b { font-family: var(--mono); font-weight: 400; }
.scale b.warn { color: var(--amber-ink); }

@media (max-width: 1100px) {
  .page { padding: 20px 16px; }
  .cols, .three { grid-template-columns: minmax(0, 1fr); }
  .grown { padding: 20px 16px; }
}
</style>
</head>
<body>
<main class="page">
  <header><h1 id="title">Modeller</h1><p>click a story, a document or an entity: the other two light up</p><p id="alone" class="alone" hidden>read from the stories alone: who is told needs a run</p></header>
  <div class="cols">
    <section id="stories" aria-labelledby="stories-head"></section>
    <section id="documents" aria-labelledby="documents-head"></section>
    <section id="entities" aria-labelledby="entities-head"></section>
  </div>
</main>
<div id="pop"></div>
<div id="grown"></div>
<script id="data" type="application/json">__DATA__</script>
<script type="module">__SCRIPT__</script>
</body>
</html>
