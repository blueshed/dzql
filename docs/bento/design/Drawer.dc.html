<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change in a drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5fb3}a:hover{color:#1f4690}
.cap{font-size:11.5px;line-height:16px;letter-spacing:0.14em;text-transform:uppercase;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid rgba(29,39,51,0.1)}
.what{font-weight:600;font-size:15px;color:#1d2733;border:0;background:none;padding:0;font-family:inherit;text-align:left;cursor:pointer}
.line{font-size:13px;color:#5d6877}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:#5d6877;font-weight:600}
.field input,.field textarea{font:inherit;font-size:16px;color:#1d2733;border:1px solid rgba(29,39,51,0.52);border-radius:6px;padding:9px 10px;background:#fff}
.prop{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid rgba(29,39,51,0.08)}
.prop span:first-child{color:#5d6877}
.btn{height:40px;padding:0 16px;border-radius:6px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 36px; background: #f5f6f8; color: #1d2733; font-family: 'IBM Plex Sans', system-ui, sans-serif; position: relative">
  <nav class="cap" aria-label="Where you are" style="display: flex; align-items: center; gap: 6px; color: #5d6877"><a href="#" style="text-decoration: none">The family</a><span aria-hidden="true">›</span><span aria-current="page">Japan</span></nav>
  <h1 style="margin: 6px 0 18px; font-size: 32px; font-weight: 600">Japan</h1>
  <section aria-label="What's asked" style="width: 800px; background: #fff; border-radius: 20px; padding: 10px 18px; box-shadow: 0 12px 30px rgba(29,39,51,0.12)">
    <div class="row"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><button class="what">Land at Haneda</button><span class="line">Everyone · Sun 8 Nov · Tokyo</span></span></div>
    <div class="row" aria-expanded="true" style="background: #eaf0fb; border-radius: 10px; box-shadow: inset 3px 0 0 #2f5fb3"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><button class="what">Book the ryokan in Hakone</button><span class="line">Peter asks you · by Fri 30 Oct · Hakone</span></span></div>
    <div class="row"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><button class="what">Book teamLab tickets</button><span class="line">Daisy said yes · by Mon 9 Nov · Toyosu</span></span></div>
    <div class="row" style="border-bottom: 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><button class="what">Can we do a konbini crawl?</button><span class="line">Ann asks everyone · an idea · Tokyo</span></span></div>
  </section>

  <aside role="dialog" aria-label="Book the ryokan in Hakone" style="position: absolute; right: 24px; top: 24px; bottom: 24px; width: 340px; background: #fff; border: 1px solid rgba(29,39,51,0.14); border-radius: 20px 28px 28px 20px; box-shadow: 0 8px 30px rgba(29,39,51,0.2); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600">Book the ryokan in Hakone</h2>
      <button aria-label="Close" style="width: 32px; height: 32px; border: 0; background: none; color: #5d6877; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>
    <div style="flex: 1; overflow: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 13.5px; color: #5d6877">Peter asks you · by Fri 30 Oct</p>
      <div>
        <div class="prop"><span>Before</span><span>Hakone, 12 Nov</span></div>
        <div class="prop"><span>In</span><span>Japan</span></div>
        <div class="prop"><span>Where</span><a href="#" style="text-decoration: none">Hakone ›</a></div>
      </div>
      <div class="field"><label for="notes">Notes</label><textarea id="notes" rows="3">Two rooms, the one with the outdoor bath if they still have it.</textarea></div>
      <span role="status" style="font-size: 12px; color: #2f8a5b; display: inline-flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Saved as you type</span>
    </div>
    <div style="padding: 14px 16px; border-top: 1px solid rgba(29,39,51,0.1); display: flex; gap: 8px">
      <button class="btn" style="flex: 1; border: 0; background: #2f5fb3; color: #fff">Yes, I can</button>
      <button class="btn" style="border: 1px solid rgba(29,39,51,0.52); background: #fff; color: #1d2733">Not me</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
