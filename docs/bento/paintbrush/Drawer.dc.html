<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change the flat white</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1a1a1a}a:hover{color:#555}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:0 12px;min-height:32px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#1a1a1a;cursor:pointer}
.run{font-size:12px;color:#555;margin-top:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-top:1px solid #eee}
.item{border:0;background:none;padding:0;font:inherit;font-size:14px;color:#1a1a1a;cursor:pointer;text-align:left}
.muted{color:#555;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.legend{font-size:12px;color:#555}
.field input,.field textarea{font:inherit;font-size:14px;color:#1a1a1a;border:1px solid #ddd;border-radius:4px;padding:8px;background:#fff}
.chip{font:inherit;font-size:13px;min-height:32px;padding:0 12px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#1a1a1a;cursor:pointer}
.chip[aria-checked="true"]{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
@media (pointer: coarse){.btn,.chip{min-height:44px}.field input{min-height:44px;font-size:16px}}
@media (max-width: 720px){.drawer{left:0 !important;top:auto !important;width:auto !important;border-left:0 !important;border-top:1px solid #ccc}}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; padding: 32px 16px; position: relative; background: #f8f9fa; color: #1a1a1a; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5">

    <nav aria-label="Where you are" style="display: flex; gap: 6px; font-size: 13px; color: #555"><a href="#">Cafés</a><span aria-hidden="true">›</span><span aria-current="page">Corner Café</span></nav>
    <div style="display: flex; align-items: center; gap: 8px"><img src="logo.png" alt="" width="32" height="32" style="display: block"><h1 style="margin: 0; font-size: 20px; font-weight: 600">Corner Café</h1></div>
    <section aria-label="Menu" style="background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 16px; max-width: 540px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600">Menu</h2>
      <div class="run">Coffee</div>
      <div class="row" aria-current="true" style="background: #f0f0f0; border-radius: 4px; box-shadow: inset 2px 0 0 #1a1a1a"><button class="item">Flat white</button><span class="muted" style="margin-left: auto">£3.40</span></div>
      <div class="row"><button class="item">Cortado</button><span class="muted" style="margin-left: auto">£3.00</span></div>
      <div class="row"><button class="item">Oat latte</button><span class="muted" style="margin-left: auto">£3.60</span></div>
      <div class="run">Food</div>
      <div class="row"><button class="item">Banana bread</button><span class="muted" style="margin-left: auto">£3.50</span></div>
      <div class="row"><button class="item">Cheese toastie</button><span class="muted" style="margin-left: auto">£6.50</span></div>
    </section>
  </div>

  <aside class="drawer" role="dialog" aria-label="Flat white" style="position: absolute; top: 0; right: 0; bottom: 0; width: 360px; box-sizing: border-box; background: #fff; border-left: 1px solid #ccc; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">Flat white</h2>
      <button aria-label="Close" style="width: 32px; height: 32px; border: 0; background: none; color: #555; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="flex: 1; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
      <div class="field"><label for="name">Name</label><input id="name" value="Flat white"></div>
      <div class="field"><label for="price">Price, £</label><input id="price" value="3.40" inputmode="decimal"></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="legend" id="group">On the menu under</span>
        <div role="radiogroup" aria-labelledby="group" style="display: flex; gap: 6px"><button class="chip" role="radio" aria-checked="true">Coffee</button><button class="chip" role="radio" aria-checked="false">Food</button></div>
      </div>
      <div class="field"><label for="about">What it is</label><textarea id="about" rows="3" style="resize: vertical">Double ristretto, steamed whole milk.</textarea></div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px"><input type="checkbox" style="width: 16px; height: 16px; margin: 0">Sold out today</label>
      <span role="status" style="font-size: 12px; color: #555; display: inline-flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Price saved</span>
    </div>
    <div style="padding: 12px 16px; border-top: 1px solid #eee">
      <a href="Modal.dc.html" style="font-size: 13px; color: #b02a2a">Take it off the menu…</a>
    </div>
  </aside>
</div>
</x-dc>
