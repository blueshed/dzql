<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t d">
  <title id="t">The eta stack</title>
  <desc id="d">Three layers. A write leaves the browser, the server applies it to a document in SQLite, and the echo comes back the same way as HTML.</desc>
  <style>
    .box   { fill: #eaf1fb; stroke: #a3b2c7; stroke-width: 1.5; }
    .name  { fill: #222b36; font-weight: 640; font-size: 20px; }
    .sub   { fill: #59636e; font-size: 14.5px; }
    .flow  { stroke: #8fa2bd; stroke-width: 2; fill: none; }
    .head  { fill: #8fa2bd; }
    .label { fill: #5d6b7e; font-size: 12.5px; letter-spacing: 0.05em; text-transform: uppercase; }
    .foot  { fill: #59636e; font-size: 14.5px; font-style: italic; }
    text   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .box   { fill: #18202c; stroke: #55647c; }
      .name  { fill: #e6edf3; }
      .sub   { fill: #9198a1; }
      .flow  { stroke: #7387a3; }
      .head  { fill: #7387a3; }
      .label { fill: #9aa8bb; }
      .foot  { fill: #9198a1; }
    }
  </style>

  <g class="box">
    <rect x="186" y="34"  width="348" height="86" rx="14" />
    <rect x="186" y="182" width="348" height="86" rx="14" />
    <rect x="186" y="330" width="348" height="86" rx="14" />
  </g>

  <g text-anchor="middle">
    <text class="name" x="360" y="70">the browser</text>
    <text class="sub"  x="360" y="96">morphs the HTML · runs the applets</text>

    <text class="name" x="360" y="218">the server</text>
    <text class="sub"  x="360" y="244">the only renderer</text>

    <text class="name" x="360" y="366">documents</text>
    <text class="sub"  x="360" y="392">SQLite · one read, one patch</text>
  </g>

  <g class="flow">
    <path d="M300 126 V 168" />
    <path d="M420 176 V 134" />
    <path d="M300 274 V 316" />
    <path d="M420 324 V 282" />
  </g>
  <g class="head">
    <polygon points="292,166 300,180 308,166" />
    <polygon points="412,136 420,122 428,136" />
    <polygon points="292,314 300,328 308,314" />
    <polygon points="412,284 420,270 428,284" />
  </g>

  <g class="label">
    <text x="288" y="157" text-anchor="end">a write</text>
    <text x="432" y="157">HTML</text>
    <text x="288" y="305" text-anchor="end">one patch</text>
    <text x="432" y="305">the echo</text>
  </g>

  <text class="foot" x="360" y="450" text-anchor="middle">every patch records its inverse, so undo costs nothing</text>
</svg>
