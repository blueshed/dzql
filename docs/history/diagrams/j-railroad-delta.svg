<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" role="img" aria-labelledby="t d">
  <title id="t">railroad and delta: the echo renders the write</title>
  <desc id="d">A sequence. The client sends one op and changes nothing. The server composes the document from the tables and sends the op back. Only then does the client render. There is no optimistic update.</desc>
  <style>
    .box{fill:#eaf1fb;stroke:#a3b2c7;stroke-width:1.5}
    .ghost{fill:none;stroke:#a3b2c7;stroke-width:1.5;stroke-dasharray:5 4}
    .life{stroke:#a3b2c7;stroke-width:1.5;stroke-dasharray:4 5;fill:none}
    .name{fill:#222b36;font-weight:640;font-size:16px}
    .sub{fill:#59636e;font-size:12px}
    .flow{stroke:#8fa2bd;stroke-width:2;fill:none}
    .head{fill:#8fa2bd}
    .key{fill:#3e5b84;font-weight:640;font-size:14px}
    .msg{fill:#3f4d5e;font-size:13px}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;fill:#3f4d5e}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme:dark){
      .box{fill:#18202c;stroke:#55647c}.ghost{stroke:#55647c}.life{stroke:#55647c}
      .name{fill:#e6edf3}.sub{fill:#9198a1}.flow{stroke:#7387a3}.head{fill:#7387a3}
      .key{fill:#94add1}.msg{fill:#c3cbd6}.mono{fill:#c3cbd6}
    }
  </style>

  <rect class="box" x="84" y="10" width="172" height="44" rx="10" />
  <text class="name" x="170" y="38" text-anchor="middle">the client</text>
  <path class="life" d="M170 54 V 226" />

  <rect class="box" x="384" y="10" width="172" height="44" rx="10" />
  <text class="name" x="470" y="38" text-anchor="middle">the server</text>
  <path class="life" d="M470 54 V 226" />

  <g class="flow"><path d="M170 96 H 450" /></g>
  <polygon class="head" points="448,88 464,96 448,104" />
  <text class="mono" x="320" y="88" text-anchor="middle">add  /courses/3  { … }</text>

  <g class="flow"><path d="M470 122 H 524 V 152 H 486" /></g>
  <polygon class="head" points="488,144 472,152 488,160" />
  <text class="sub" x="538" y="134">composes it from the tables,</text>
  <text class="sub" x="538" y="151">bumps the version,</text>
  <text class="sub" x="538" y="168">tells whoever is watching</text>

  <g class="flow"><path d="M470 194 H 190" /></g>
  <polygon class="head" points="192,186 176,194 192,202" />
  <text class="msg" x="320" y="186" text-anchor="middle">the same op, now true</text>

  <rect class="ghost" x="20" y="112" width="132" height="56" rx="10" />
  <text class="sub" x="86" y="136" text-anchor="middle">nothing has</text>
  <text class="sub" x="86" y="153" text-anchor="middle">changed here yet</text>

  <text class="key" x="360" y="252" text-anchor="middle">no optimistic write — the echo is what renders it</text>
</svg>
