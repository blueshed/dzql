[test]
# coverage is always on, and 100% is a gate, not an aim: the run fails below it. The table holds
# only what a test loads in its own process, so three kinds of file are outside it, by design.
# A script that only runs as one: src/start.ts, src/cli.ts and src/stories-run.ts, thin over tested
# code; each example's scripts/measure-render-cost.ts, which src/costs.ts runs whole, each in a
# process of its own, whenever `bun test` checks the README; the bento mock-up's server and design
# build, run by hand; and the modeller's commands, run by hand too (modeller/closure.ts and
# page.ts), whose logic is in the files their tests load.
# Code that only runs in a browser: src/client/, src/applets.ts, src/island.ts,
# each example's client/main.ts and its applets' mountings (`*-applet.ts*`, the wedding's
# picture-field.ts), which the WebView tests drive where coverage cannot see, the mock-up's
# app.ts, and the modeller page's script (modeller/heart.client.ts; its layout is tested). And a file of types alone (src/example.ts, src/connection.ts,
# src/compartments/compartment.ts), with nothing to run. Anything else is loaded by a test: even
# src/costs.ts, a script, is taken in hand by its own
coverage = true
coverageThreshold = 1.0
# delta is linked from its checkout: its source is delta's to cover, not eta's. modeller/model/ is
# a copy of hjeli's model and predicates, covered by hjeli's own tests (modeller/model/README.md).
# An example's stories.ts is a declaration `bun run stories:all` runs whole; a test that imports
# one to run a story or two would otherwise count the rest as uncovered
# create/setup.ts is bun create's postinstall: its test runs it whole, as bun create does, on a
# scratch copy of eta, in a process of its own, then the new project's own gate.
coveragePathIgnorePatterns = ["**/node_modules/**", "modeller/model/**", "examples/*/stories.ts", "create/setup.ts"]
