name: dzql

# Runs when dzql or create-dzql, delta or railroad (what dzql runs on), or what every package
# shares changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "packages/dzql/**"
      - "packages/create-dzql/**"
      - "packages/delta/**"
      - "packages/railroad/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dzql.yml"
  pull_request:
    paths: *paths
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dzql
          POSTGRES_PASSWORD: dzql
          POSTGRES_DB: dzql
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://dzql:dzql@localhost:5432/dzql
      NODE_ENV: test
      LOG_LEVEL: ERROR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # One Bun, pinned: a Bun release cannot turn the gate red with no change here
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: packages/dzql
        run: bun check

      # The service above stands in for compose.yml's database, so bun test, not bun run test
      - name: Test
        working-directory: packages/dzql
        run: bun --config=tests/bunfig.toml test tests/

  # eta's modelling and rendering (src/modelling, src/rendering) and its examples: SQLite in the
  # process and a real browser, no Postgres. Held to 100% coverage (eta.bunfig.toml), each example's
  # stories told by hand, and the README's measured numbers checked. An island is a railroad
  # component, so a railroad change that breaks one fails here.
  eta:
    name: eta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/dzql
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
        working-directory: .

      - name: Locate Chrome for Bun.WebView
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo "No Chrome/Chromium found on runner" >&2; exit 1; fi
          echo "BUN_CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      # two workers and a longer wait than a Mac needs: a runner is slower, and its Chrome starts cold
      - run: bun run test:eta:ci
      - run: bun run stories:all
      - run: bun run costs --check
