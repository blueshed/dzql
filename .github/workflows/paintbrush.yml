name: paintbrush

# Runs when paintbrush, delta or railroad (what it runs on), or what every package shares changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "packages/paintbrush/**"
      - "packages/delta/**"
      - "packages/railroad/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/paintbrush.yml"
  pull_request:
    paths: *paths
  workflow_call:

defaults:
  run:
    working-directory: packages/paintbrush

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
        working-directory: .

      # Bun.WebView needs a Chrome; its sandbox does not start under the runner's AppArmor rules
      - name: Chrome for Bun.WebView
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo "No Chrome or Chromium on the runner" >&2; exit 1; fi
          printf '#!/bin/sh\nexec %s --no-sandbox "$@"\n' "$chrome" | sudo tee /usr/local/bin/chrome-no-sandbox >/dev/null
          sudo chmod +x /usr/local/bin/chrome-no-sandbox
          echo "BUN_CHROME_PATH=/usr/local/bin/chrome-no-sandbox" >> "$GITHUB_ENV"

      - run: bun run test:fast
      - run: bun run test:slow
