name: Publish to npm

# A pushed tag `<package>@x.y.z` publishes that package from packages/<package>, after its gate
# (the package's own workflow, called). /publish pushes the tags of one release round together.
#
# npm Trusted Publisher, once per package on npmjs.com (Settings → Trusted publishing):
#   GitHub Actions, this repository, workflow publish.yml, environment blank.

on:
  push:
    tags:
      - "railroad@*"
      - "delta@*"
      - "dzql@*"
      - "create-dzql@*"
      - "create-blueshed@*"

jobs:
  which:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "package=${tag%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  gate-railroad:
    needs: which
    if: needs.which.outputs.package == 'railroad'
    uses: ./.github/workflows/railroad.yml

  # package.json promises Bun 1.3.14 or later: every test but the browser's on that floor, before a
  # release (1.3.12 and 1.3.13 pass too, but their `bun build --compile` binaries are killed on macOS
  # arm64, so the README's one-binary deploy needs 1.3.14). Not on every push: Bun's floor moves seldom.
  floor-railroad:
    needs: which
    if: needs.which.outputs.package == 'railroad'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/railroad
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test --path-ignore-patterns="tests/webview*.test.ts"

  gate-delta:
    needs: which
    if: needs.which.outputs.package == 'delta'
    uses: ./.github/workflows/delta.yml

  gate-dzql:
    needs: which
    if: needs.which.outputs.package == 'dzql' || needs.which.outputs.package == 'create-dzql'
    uses: ./.github/workflows/dzql-postgres.yml

  gate-dzql-eta:
    needs: which
    if: needs.which.outputs.package == 'dzql'
    uses: ./.github/workflows/dzql-eta.yml

  # create-blueshed publishes paintbrush (its prepack copies it in): paintbrush's gate
  gate-paintbrush:
    needs: which
    if: needs.which.outputs.package == 'create-blueshed'
    uses: ./.github/workflows/paintbrush.yml

  publish:
    needs: [which, gate-railroad, floor-railroad, gate-delta, gate-dzql, gate-dzql-eta, gate-paintbrush]
    # The one gate that ran passed; the others were skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ needs.which.outputs.package }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm publish runs a package's own scripts: delta's `prepare` is Bun's
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ needs.which.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: NODE_AUTH_TOKEN="" npm publish --provenance --access public
