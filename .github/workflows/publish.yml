name: Publish to npm

# A pushed tag `<package>@x.y.z` publishes that package from packages/<package>, after its gate
# (its own test:fast and test:slow). /publish pushes the tags of one release round together.
#
# npm Trusted Publisher, once per package on npmjs.com (Settings → Trusted publishing):
#   GitHub Actions, this repository, workflow publish.yml, environment blank.

on:
  push:
    tags:
      - "railroad@*"
      - "delta@*"
      - "dzql@*"
      - "create-dzql@*"
      - "create-blueshed@*"

jobs:
  which:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "package=${tag%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

  # The package's own gate: its fast tier, then its slow one where it has one (create-blueshed's runs
  # paintbrush's, which it packs; create-dzql's fast tier makes a new app and starts it)
  gate:
    needs: which
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/${{ needs.which.outputs.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: |
          bun run test:fast
          if bun -e "process.exit(require('./package.json').scripts?.['test:slow'] ? 0 : 1)"; then bun run test:slow; fi

  # railroad's engines.bun is its floor: every test but the browser's on that Bun, before a release
  # (1.3.12 and 1.3.13 pass too, but their `bun build --compile` binaries are killed on macOS arm64,
  # so the README's one-binary deploy needs 1.3.14). Not on every push: Bun's floor moves seldom.
  floor-railroad:
    needs: which
    if: needs.which.outputs.package == 'railroad'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/railroad
    steps:
      - uses: actions/checkout@v6
      - id: floor
        run: echo "bun=$(jq -r '.engines.bun' package.json | sed 's/^>=//')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.floor.outputs.bun }}
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun test --path-ignore-patterns="tests/webview*.test.ts"

  publish:
    needs: [which, gate, floor-railroad]
    # the gate passed; the floor ran for railroad alone, and was skipped for the others
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ needs.which.outputs.package }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm publish runs a package's own scripts: delta's `prepare` is Bun's
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ needs.which.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: NODE_AUTH_TOKEN="" npm publish --provenance --access public
