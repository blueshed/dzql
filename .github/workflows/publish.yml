name: Publish to npm

on:
  push:
    tags:
      - "dzql@*"
      - "create-dzql@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - dzql
          - create-dzql
          - both

jobs:
  publish-dzql:
    if: startsWith(github.ref, 'refs/tags/dzql@') || (github.event_name == 'workflow_dispatch' && (inputs.package == 'dzql' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish dzql
        working-directory: packages/tzql
        run: |
          npm config set //registry.npmjs.org/:_authToken ''
          npm publish --provenance --access public

  publish-create-dzql:
    if: startsWith(github.ref, 'refs/tags/create-dzql@') || (github.event_name == 'workflow_dispatch' && (inputs.package == 'create-dzql' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish create-dzql
        working-directory: packages/create-dzql
        run: |
          npm config set //registry.npmjs.org/:_authToken ''
          npm publish --provenance --access public
