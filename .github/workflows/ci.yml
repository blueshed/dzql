name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dzql
          POSTGRES_PASSWORD: dzql
          POSTGRES_DB: dzql
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://dzql:dzql@localhost:5432/dzql
      NODE_ENV: test
      LOG_LEVEL: ERROR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # One Bun, pinned: a Bun release cannot turn the gate red with no change here
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: packages/dzql
        run: bunx tsc --noEmit

      # The service above stands in for compose.yml's database, so bun test, not bun run test
      - name: Test
        working-directory: packages/dzql
        run: bun test
