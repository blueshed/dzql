services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tzql
      POSTGRES_PASSWORD: tzql
      POSTGRES_DB: tzql
    volumes:
      # Mount compiled migrations
      - ./dist/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzql"]
      interval: 5s
      timeout: 5s
      retries: 5
