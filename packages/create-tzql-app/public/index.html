<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TZQL App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; line-height: 1.6; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 1rem; }
    .status { padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
    .status.connected { background: #d4edda; color: #155724; }
    .status.disconnected { background: #f8d7da; color: #721c24; }
    .card { background: #f8f9fa; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    pre { background: #282c34; color: #abb2bf; padding: 1rem; border-radius: 4px; overflow-x: auto; }
    button { background: #007bff; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    input { padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>TZQL App</h1>

  <div id="status" class="status disconnected">Disconnected</div>

  <div class="card">
    <h3>Quick Start</h3>
    <p>Your TZQL app is running! Edit <code>entities.js</code> to define your domain.</p>
  </div>

  <div class="card">
    <h3>Test Connection</h3>
    <button onclick="testPing()">Ping Server</button>
    <pre id="output">Waiting for connection...</pre>
  </div>

  <script type="module">
    // Import the generated client SDK
    // import { TZQLClient } from './dist/client/index.js';

    let ws;
    let messageId = 0;
    const pending = new Map();

    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => {
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };

      ws.onclose = () => {
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log('Received:', msg);

        if (msg.id && pending.has(msg.id)) {
          pending.get(msg.id)(msg);
          pending.delete(msg.id);
        }

        document.getElementById('output').textContent = JSON.stringify(msg, null, 2);
      };
    }

    function send(method, params = {}) {
      return new Promise((resolve) => {
        const id = ++messageId;
        pending.set(id, resolve);
        ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
      });
    }

    window.testPing = async () => {
      const result = await send('ping');
      console.log('Ping result:', result);
    };

    connect();
  </script>
</body>
</html>
