<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Agent Chat Room</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #2d2d30;
      padding: 1rem;
      border-bottom: 2px solid #3e3e42;
    }

    h1 {
      font-size: 1.2rem;
      color: #569cd6;
    }

    .status {
      font-size: 0.9rem;
      color: #858585;
      margin-top: 0.5rem;
    }

    .status.connected {
      color: #4ec9b0;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1px;
      background: #3e3e42;
      overflow: hidden;
    }

    main:empty::before {
      content: 'Waiting for agents to connect...';
      color: #858585;
      padding: 2rem;
      text-align: center;
      grid-column: 1 / -1;
    }

    .agent-pane {
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
    }

    .agent-header {
      background: #2d2d30;
      padding: 0.75rem;
      border-bottom: 1px solid #3e3e42;
      font-weight: bold;
    }

    .agent-header.claude {
      color: #ce9178;
    }

    .agent-header.gemini {
      color: #4ec9b0;
    }

    .agent-header.codex {
      color: #10a37f;
    }

    .agent-header.other {
      color: #c586c0;
    }

    .agent-output {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .message {
      margin-bottom: 1rem;
      padding: 0.5rem;
      border-left: 3px solid #3e3e42;
      cursor: pointer;
      transition: background 0.2s;
    }

    .message:hover {
      background: #2d2d30;
    }

    .message.selected {
      background: #37373d;
      border-left-color: #569cd6;
    }

    .message-meta {
      font-size: 0.75rem;
      color: #858585;
      margin-bottom: 0.25rem;
    }

    .message-body {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.system {
      border-left-color: #858585;
      font-style: italic;
      opacity: 0.7;
    }

    .message.human {
      border-left-color: #569cd6;
      background: #264f78;
    }

    footer {
      background: #2d2d30;
      padding: 1rem;
      border-top: 2px solid #3e3e42;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    button {
      background: #0e639c;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
    }

    button:hover {
      background: #1177bb;
    }

    button:disabled {
      background: #3e3e42;
      color: #858585;
      cursor: not-allowed;
    }

    .input-area {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"], textarea {
      flex: 1;
      background: #3c3c3c;
      border: 1px solid #3e3e42;
      color: #d4d4d4;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 3px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #569cd6;
    }

    select {
      background: #3c3c3c;
      border: 1px solid #3e3e42;
      color: #d4d4d4;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎭 Multi-Agent Chat Room</h1>
    <div class="status" id="status">Connecting...</div>
  </header>

  <main id="main-panes">
    <!-- Agent panes will be dynamically created -->
  </main>

  <footer>
    <div class="controls">
      <button id="forward-btn" disabled>Forward Selected →</button>
      <select id="target-agent" disabled>
        <option value="">Select target...</option>
      </select>
      <button id="clear-btn">Clear All</button>
      <button id="export-btn">Export Transcript</button>
    </div>

    <div class="input-area">
      <textarea id="message-input" placeholder="Type a message to inject into the conversation..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </footer>

  <script>
    // WebSocket connection
    let ws = null;
    let selectedMessage = null;
    const agents = new Map(); // agentId -> { name, paneEl }

    // DOM elements
    const statusEl = document.getElementById('status');
    const forwardBtn = document.getElementById('forward-btn');
    const targetSelect = document.getElementById('target-agent');
    const clearBtn = document.getElementById('clear-btn');
    const exportBtn = document.getElementById('export-btn');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const mainPanes = document.getElementById('main-panes');

    // Connect to WebSocket
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('Connected to server');
        statusEl.textContent = 'Connected';
        statusEl.classList.add('connected');

        // Register as web client
        ws.send(JSON.stringify({
          type: 'register',
          role: 'web'
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };

      ws.onclose = () => {
        console.log('Disconnected from server');
        statusEl.textContent = 'Disconnected - Reconnecting...';
        statusEl.classList.remove('connected');

        // Reconnect after 2 seconds
        setTimeout(connect, 2000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };
    }

    // Create a pane for an agent
    function createAgentPane(agentId, agentName) {
      const paneDiv = document.createElement('div');
      paneDiv.className = 'agent-pane';
      paneDiv.id = `pane-${agentId}`;

      const headerDiv = document.createElement('div');
      headerDiv.className = 'agent-header';

      // Color coding based on agent name
      const nameLower = agentName.toLowerCase();
      if (nameLower.includes('claude')) {
        headerDiv.classList.add('claude');
      } else if (nameLower.includes('gemini')) {
        headerDiv.classList.add('gemini');
      } else if (nameLower.includes('codex')) {
        headerDiv.classList.add('codex');
      } else {
        headerDiv.classList.add('other');
      }
      headerDiv.textContent = agentName;

      const outputDiv = document.createElement('div');
      outputDiv.className = 'agent-output';
      outputDiv.id = `output-${agentId}`;

      paneDiv.appendChild(headerDiv);
      paneDiv.appendChild(outputDiv);
      mainPanes.appendChild(paneDiv);

      return paneDiv;
    }

    // Remove agent pane
    function removeAgentPane(agentId) {
      const pane = document.getElementById(`pane-${agentId}`);
      if (pane) {
        pane.remove();
      }
    }

    // Handle incoming message
    function handleMessage(data) {
      if (data.type === 'history') {
        // Replay full history
        data.messages.forEach(msg => displayMessage(msg));
        return;
      }

      // Track agents when they produce output
      if (data.type === 'agent_output' && data.metadata.agentId && !agents.has(data.metadata.agentId)) {
        const paneEl = createAgentPane(data.metadata.agentId, data.source);
        agents.set(data.metadata.agentId, { name: data.source, paneEl });
        updateAgentList();
      }

      if (data.type === 'system_notification' && data.body.includes('left the room')) {
        // A bit brittle, but let's try to remove the agent
        const agentName = data.body.split(' ')[0];
        for (const [id, info] of agents.entries()) {
          if (info.name === agentName) {
            removeAgentPane(id);
            agents.delete(id);
            updateAgentList();
            break;
          }
        }
      }

      displayMessage(data);
    }

    // Display message in appropriate pane
    function displayMessage(data) {
      const messageEl = document.createElement('div');
      messageEl.className = 'message';
      messageEl.id = `msg-${data.id}`;

      if (data.type === 'system_notification') {
        messageEl.classList.add('system');
      } else if (data.type === 'human_prompt') {
        messageEl.classList.add('human');
      }

      const metaEl = document.createElement('div');
      metaEl.className = 'message-meta';
      const time = new Date(data.timestamp).toLocaleTimeString();
      const targetText = data.target && data.target !== 'all' ? `→ ${data.target}` : '';
      metaEl.textContent = `[${time}] ${data.source} ${targetText}`;

      const bodyEl = document.createElement('div');
      bodyEl.className = 'message-body';
      bodyEl.textContent = data.body;

      messageEl.appendChild(metaEl);
      messageEl.appendChild(bodyEl);

      // Store full message data
      messageEl.dataset.message = JSON.stringify(data);

      // Click to select
      messageEl.addEventListener('click', () => {
        if (selectedMessage && selectedMessage.id === data.id) {
          // Deselect
          messageEl.classList.remove('selected');
          selectedMessage = null;
          forwardBtn.disabled = true;
        } else {
          // Deselect others
          document.querySelectorAll('.message.selected').forEach(el => {
            el.classList.remove('selected');
          });

          // Select this one
          messageEl.classList.add('selected');
          selectedMessage = data;
          forwardBtn.disabled = false;
        }
      });

      // Determine which pane to show message in
      if (data.type === 'system_notification' || data.type === 'human_prompt') {
        // Show system and human messages in all panes
        agents.forEach((info) => {
          const outputDiv = document.getElementById(`output-${info.paneEl.id.replace('pane-', '')}`);
          if (outputDiv) {
            const clonedEl = messageEl.cloneNode(true);
            // Re-add event listener to cloned node
            clonedEl.addEventListener('click', () => {
              if (selectedMessage && selectedMessage.id === data.id) {
                document.querySelectorAll('.message.selected').forEach(el => el.classList.remove('selected'));
                selectedMessage = null;
                forwardBtn.disabled = true;
              } else {
                document.querySelectorAll('.message.selected').forEach(el => el.classList.remove('selected'));
                clonedEl.classList.add('selected');
                selectedMessage = data;
                forwardBtn.disabled = false;
              }
            });
            outputDiv.appendChild(clonedEl);
            outputDiv.scrollTop = outputDiv.scrollHeight;
          }
        });
        return;
      }

      // For agent output, find the right pane by matching agent ID from metadata
      if (data.type === 'agent_output' && data.metadata?.agentId) {
        const agentInfo = agents.get(data.metadata.agentId);
        if (agentInfo) {
          const outputDiv = document.getElementById(`output-${data.metadata.agentId}`);
          if (outputDiv) {
            outputDiv.appendChild(messageEl);
            outputDiv.scrollTop = outputDiv.scrollHeight;
          }
        }
      }
    }

    // Update agent list in dropdown
    function updateAgentList() {
      const currentTarget = targetSelect.value;
      targetSelect.innerHTML = '<option value="">Select target...</option>';

      for (const [id, info] of agents.entries()) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = info.name;
        targetSelect.appendChild(option);
      }

      targetSelect.value = currentTarget;
      targetSelect.disabled = agents.size === 0;
    }

    // Forward selected message
    forwardBtn.addEventListener('click', () => {
      if (!selectedMessage || !targetSelect.value) return;

      ws.send(JSON.stringify({
        type: 'forward',
        targetId: targetSelect.value,
        source: selectedMessage.source,
        body: selectedMessage.body,
        original_message_id: selectedMessage.id
      }));

      // Deselect
      document.querySelector(`#msg-${selectedMessage.id}`)?.classList.remove('selected');
      selectedMessage = null;
      forwardBtn.disabled = true;
    });

    // Send human message
    sendBtn.addEventListener('click', () => {
      const message = messageInput.value.trim();
      if (!message) return;

      ws.send(JSON.stringify({
        type: 'human_prompt',
        body: message,
        target: 'all' // Or could add a UI element to target specific agents
      }));

      messageInput.value = '';
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        sendBtn.click();
      }
    });

    // Clear all messages
    clearBtn.addEventListener('click', () => {
      if (confirm('Clear all messages from view? (History remains on server)')) {
        agents.forEach((info) => {
          const outputDiv = document.getElementById(`output-${info.paneEl.id.replace('pane-', '')}`);
          if (outputDiv) {
            outputDiv.innerHTML = '';
          }
        });
      }
    });

    // Export transcript from server
    exportBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/transcript');
        if (!response.ok) {
          throw new Error(`Failed to fetch transcript: ${response.statusText}`);
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `transcript-${Date.now()}.jsonl`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Export failed:', err);
        alert(`Failed to export transcript: ${err.message}`);
      }
    });

    // Connect on load
    connect();
  </script>
</body>
</html>
