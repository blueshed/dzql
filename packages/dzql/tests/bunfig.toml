# dzql's compile and Postgres tests (bun run test:pg: tests/compile, tests/delta, tests/delta-pg).
[test]
# Coverage on every run, said in the terminal (nothing reads an lcov file).
coverage = true
coverageReporter = ["text"]
# Don't count the test files themselves toward coverage.
coverageSkipTestFiles = true
# No hard threshold yet — measure first, then ratchet up in CI once a
# realistic baseline is known (e.g. coverageThreshold = 0.8).
